      // path a little at each corner, so find each stop again on the track, near where it was.
      const track = raw.length > 2 ? smoothPath(raw, { maxCut: mode === "tram" ? TRAM_CORNER_CUT_M : BUS_CORNER_CUT_M }) : raw;
      const cum = pathLengths(track);
      const scale = rawCum.at(-1) ? cum.at(-1) / rawCum.at(-1) : 1;
      prev = 0;
      pattern.stopDist = rawStop.map((dRaw, k) => {
        if (track.length < 2) return 0;
        const [, , lng, lat] = stops[pattern.stops[k]];
        const guess = dRaw * scale;
        // On a loop the track can pass a stop twice; prefer the pass nearest the guess.
        const score = hit => hit.off + 0.05 * Math.abs(hit.d - guess);
        let best = null;
        const last = segmentAt(cum, guess + 150);
        for (let i = segmentAt(cum, Math.max(prev, guess - 150)); i <= last; i++) {
          const hit = projectOnSegment(track, cum, lng, lat, i);
          if (!best || score(hit) < score(best)) best = hit;
        }
        prev = Math.max(prev, best ? best.d : guess);
        return prev;
      });
      pattern.track = track;
      pattern.cum = cum;
      cornerProfile(pattern, mode);
      return pattern;
    }

    function pointAlong({ track, cum }, d) {
      if (track.length < 2) return track[0];
      const k = segmentAt(cum, d);
      const span = cum[k + 1] - cum[k];
      const t = span ? Math.min(1, Math.max(0, (d - cum[k]) / span)) : 0;
      return [track[k][0] + (track[k + 1][0] - track[k][0]) * t, track[k][1] + (track[k + 1][1] - track[k][1]) * t];
    }

    // ---- Slowing for corners ------------------------------------------------------------
    // Along each track, a vehicle's speed drops where the track turns: down to these shares of
    // its normal speed for a right-angle bend, braking before it and picking up after. Times at
    // stops don't change; between stops the time is shared out by the profile, so a vehicle runs
    // a little quicker on the straights and slower through the bends.
    const BUS_CORNER_CUT_M = 12, TRAM_CORNER_CUT_M = 25;  // corner rounding, matching the drawn lines
    const CORNER_SPEED = { bus: 0.35, tram: 0.45 };
    const PROFILE_STEP_M = 5;    // resolution of the speed profile
    const TURN_WINDOW_M = { bus: 12, tram: 40 };  // a turn is the change of direction over this far either side
    const BRAKE_M = 15;          // slowing down and speeding up spread over this distance

    function cornerProfile(pattern, mode) {
      const { track, cum } = pattern;
      const total = cum.at(-1);
      if (!(total > 0) || track.length < 2) {
        pattern.cost = [0, 0];
        pattern.costStep = Math.max(total, 1);
        return;
      }
      const n = Math.max(2, Math.ceil(total / PROFILE_STEP_M) + 1);
      const step = total / (n - 1);
      const heading = [];
      for (let k = 1; k < track.length; k++) {
        const kx = Math.cos(track[k][1] * Math.PI / 180);
        heading.push(Math.atan2((track[k][0] - track[k - 1][0]) * kx, track[k][1] - track[k - 1][1]));
      }
      const headingAt = d => heading[Math.min(heading.length - 1, segmentAt(cum, d))];
      const slowest = CORNER_SPEED[mode] ?? CORNER_SPEED.bus;
      const win = TURN_WINDOW_M[mode] ?? TURN_WINDOW_M.bus;
      const speed = new Float64Array(n);
      for (let i = 0; i < n; i++) {
        const d = i * step;
        let turn = Math.abs(headingAt(Math.min(total, d + win)) - headingAt(Math.max(0, d - win))) % (2 * Math.PI);
        if (turn > Math.PI) turn = 2 * Math.PI - turn;
        speed[i] = 1 - (1 - slowest) * Math.min(1, turn / (Math.PI / 2));
      }
      if (mode === "bus") pattern.junctions = junctionsAlong(speed, step, 1 - (1 - slowest) * JUNCTION_TURN / (Math.PI / 2));
      // Brake before a bend and pick up after it: take the slowest speed nearby, then smooth that.
      const r = Math.max(1, Math.round(BRAKE_M / step));
      const near = new Float64Array(n), eased = new Float64Array(n);
      for (let i = 0; i < n; i++) {
        let m = 1;
        for (let j = Math.max(0, i - r); j <= Math.min(n - 1, i + r); j++) m = Math.min(m, speed[j]);
        near[i] = m;
      }
      for (let i = 0; i < n; i++) {
        let sum = 0, count = 0;
        for (let j = Math.max(0, i - r); j <= Math.min(n - 1, i + r); j++) { sum += near[j]; count++; }
        eased[i] = sum / count;
      }
      // "Cost" of reaching each point: metres at full speed count 1, at half speed 2, and so on.
      const cost = new Float64Array(n);
      for (let i = 1; i < n; i++) cost[i] = cost[i - 1] + step * 2 / (eased[i - 1] + eased[i]);
      pattern.cost = cost;
      pattern.costStep = step;
    }

    function costAt({ cost, costStep }, d) {
      const x = Math.max(0, Math.min(cost.length - 1, d / costStep));
      const i = Math.min(cost.length - 2, Math.floor(x));
      return cost[i] + (cost[i + 1] - cost[i]) * (x - i);
    }

    function distanceForCost({ cost, costStep }, c) {
      let lo = 0, hi = cost.length - 2;
      while (lo < hi) {
        const mid = (lo + hi + 1) >> 1;
        if (cost[mid] <= c) lo = mid;
        else hi = mid - 1;
      }
      const span = cost[lo + 1] - cost[lo];
      return (lo + (span ? Math.max(0, Math.min(1, (c - cost[lo]) / span)) : 0)) * costStep;
    }

    // The point a fraction `f` of the way (in time) from d0 to d1, allowing for bends.
    function alongWithCorners(pattern, d0, d1, f) {
      if (f <= 0) return d0;
      if (f >= 1) return d1;
      const c0 = costAt(pattern, d0), c1 = costAt(pattern, d1);
      return c1 > c0 ? Math.max(d0, Math.min(d1, distanceForCost(pattern, c0 + (c1 - c0) * f))) : d0 + (d1 - d0) * f;
    }

    // ...and the inverse: what fraction of the time from d0 to d1 it takes to reach d.
    function cornerTimeFraction(pattern, d0, d1, d) {
      const c0 = costAt(pattern, d0), c1 = costAt(pattern, d1);
      return c1 > c0 ? Math.max(0, Math.min(1, (costAt(pattern, d) - c0) / (c1 - c0))) : (d1 > d0 ? (d - d0) / (d1 - d0) : 0);
    }

    // ---- Hold-ups at junctions -------------------------------------------------------------
    // Until live positions come in, each bus is held up at random at some junctions: stopping
    // (lights, giving way) or slowing (traffic), as a dip in its speed centred on the junction.
    // A journey's draws come from its own key, so a bus does the same thing every time it's
    // drawn. Times at stops don't change: a bus that's held up runs a little quicker either side.
    const JUNCTION_TURN = Math.PI / 6;   // a bend of 30° or more counts as a junction
    const LIGHTS_EVERY_M = 450;          // long straights get a set of lights about this often
    const STOP_CHANCE = 0.3, SLOW_CHANCE = 0.3;
    const BRAKE_DISTANCE_M = 30;         // a stop brakes over this far, and pulls away over the same
    const SLOW_DISTANCE_M = 30;          // a slow-down eases in and out over at least this far either side
    const MAX_HOLD_SHARE = 0.35;         // never more than this share of a stop-to-stop run
    const MAX_CATCH_UP_SPEED = 18;       // m/s: catching up mustn't need more than this

    // Junctions along a track: the sharpest point of each bend (from the turn-based speeds,
    // one every `step` metres), plus evenly spaced lights on long straights.
    function junctionsAlong(speed, step, threshold) {
      const bends = [];
      for (let i = 1; i < speed.length - 1; i++) {
        if (speed[i] > threshold || speed[i] > speed[i - 1] || speed[i] >= speed[i + 1]) continue;
        if (!bends.length || i * step - bends.at(-1) > 40) bends.push(i * step);
      }
      const all = [];
      let last = 0;
      for (const d of [...bends, (speed.length - 1) * step]) {
        const lights = Math.round((d - last) / LIGHTS_EVERY_M) - 1;
        for (let k = 1; k <= lights; k++) all.push(last + (d - last) * k / (lights + 1));
        all.push(d);
        last = d;
      }
      all.pop();  // the end of the track
      return all;
    }

    // Random numbers from a seed string (mulberry32).
    function seededRandom(text) {
      let a = 2166136261;
      for (let i = 0; i < text.length; i++) a = Math.imul(a ^ text.charCodeAt(i), 16777619);
      return () => {
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // A trip's hold-ups, as extra "cost" (see cornerProfile) around a junction at x in
    // stop-to-stop run j, sized so they take the drawn number of seconds out of the run.
    //   stop: brakes at a steady rate to a standstill over b metres, waits (cost q), then pulls
    //         away the same way. Steady braking means speed ∝ √(distance to go), which is extra
    //         cost density 1/√s − 1 over the last b metres: b in all, and the same again after.
    //   slow: a smooth dip in speed over ±w metres, extra density a·(1 + cos πs)/2, a·w in all.
    // Every bus stops at every stop: it brakes steadily to a standstill over up to STOP_BRAKE_M,
    // waits, and pulls away the same way. The wait comes at the end of each stop-to-stop run, so
    // the bus is at the stop until its timetabled time and leaves on time.
    const STOP_BRAKE_M = 30, MIN_STOP_BRAKE_M = 5, DWELL_SECS = [4, 12];

    function tripHolds(trip) {
      if (trip.holds) return trip.holds;
      const P = trip.pattern, T = stopTimes(trip), D = P.stopDist;
      const key = trip.key ?? `${trip.line}|${trip.variant}|${trip.start}`;
      const rand = seededRandom(key), dwellRand = seededRandom(`${key}|stops`);
      const runs = new Map();
      let j = 0;
      for (const x of P.junctions ?? []) {
        while (j + 1 < D.length && D[j + 1] <= x) j++;
        if (j + 1 >= D.length) break;
        const kind = rand(), size = rand();  // always two draws, so each junction keeps its own
        const room = Math.min(x - D[j], D[j + 1] - x) - 5;  // keep clear of the stops
        if (room < 20 || kind >= STOP_CHANCE + SLOW_CHANCE) continue;
        const stop = kind < STOP_CHANCE;
        if (!runs.has(j)) runs.set(j, []);
        runs.get(j).push({ x, room, stop, secs: stop ? 2 + 6 * size : 1 + 2 * size });
      }
      const holds = [];
      trip.dwell = [];
      for (let j = 0; j + 1 < D.length; j++) {
        const wantDwell = DWELL_SECS[0] + (DWELL_SECS[1] - DWELL_SECS[0]) * dwellRand();  // always drawn
        trip.dwell[j] = 0;
        const dt = T[j + 1] - T[j], C = costAt(P, D[j + 1]) - costAt(P, D[j]), metres = D[j + 1] - D[j];
        if (!(dt > 0 && C > 0 && metres > 2 * MIN_STOP_BRAKE_M)) continue;
        // The run's moving time is shared out in proportion to cost, and cost counts straight
        // metres as 1, so a run of cost C in m seconds has the bus doing C / m on its straights:
        // MAX_CATCH_UP_SPEED limits that. Braking into the next stop and pulling away from this
        // one add b of cost each; the wait at the end takes time away from moving.
        const b = Math.min(STOP_BRAKE_M, metres / 3, (MAX_CATCH_UP_SPEED * dt - C) / 2);
        if (b < MIN_STOP_BRAKE_M) continue;  // the timetable leaves no time to stop properly
        const dwell = Math.min(wantDwell, MAX_HOLD_SHARE * dt, dt - (C + 2 * b) / MAX_CATCH_UP_SPEED);
        trip.dwell[j] = Math.max(0, dwell);
        holds.push({ j, x: D[j], stop: true, b, q: 0 }, { j, x: D[j + 1], stop: true, b, q: 0 });

        // Hold-ups at junctions along the way, in what's left.
        const parts = runs.get(j);
        if (!parts) continue;
        const moving = dt - trip.dwell[j], base = C + 2 * b;
        const room = MAX_CATCH_UP_SPEED * moving - base;  // most extra cost the speed limit allows
        if (room <= 0) continue;
        for (const part of parts) if (part.stop) part.b = Math.min(BRAKE_DISTANCE_M, part.room);
        // A bus with no time to spare doesn't stop: drop stops until braking fits.
        while (parts.some(part => part.stop) &&
               2 * parts.reduce((sum, part) => sum + (part.stop ? part.b : 0), 0) > room) {
          parts.splice(parts.findLastIndex(part => part.stop), 1);
        }
        // With extra cost E the bus takes moving / (base + E) seconds per unit of cost, so
        // waiting and slowing for W seconds, on top of braking and pulling away (2B), needs
        // E = (2B·moving + W·base) / (moving − W).
        const B = parts.reduce((sum, part) => sum + (part.stop ? part.b : 0), 0);
        const extraFor = W => (2 * B * moving + W * base) / (moving - W);
        const wanted = parts.reduce((sum, part) => sum + part.secs, 0);
        let W = Math.min(wanted, MAX_HOLD_SHARE * moving);
        while (W > 0.5 && extraFor(W) > room) W *= 0.8;
        if (W <= 0.5) W = 0;
        const perCost = moving / (base + extraFor(W));  // seconds per unit of cost, hold-ups included
        const share = wanted ? W / wanted : 0;
        for (const part of parts) {
          const secs = part.secs * share;
          if (part.stop) holds.push({ j, x: part.x, stop: true, b: part.b, q: secs / perCost });
          else if (secs > 0) {
            // Faster buses ease over a longer stretch, so slowing stays gentle.
            const w = Math.min(part.room, Math.max(SLOW_DISTANCE_M, 3 * C / dt));
            holds.push({ j, x: part.x, stop: false, w, a: secs / perCost / w });
          }
        }
      }
      return (trip.holds = holds);
    }

    // Extra cost a hold-up adds between the start of the run and distance d.
    function holdCost(h, d) {
      if (h.stop) {
        const u = d - h.x;
        if (u <= -h.b) return 0;
        if (u < 0) { const s = -u / h.b; return h.b * (1 - 2 * Math.sqrt(s) + s); }
        const s = Math.min(1, u / h.b);
        return h.b + h.q + h.b * (2 * Math.sqrt(s) - s);
      }
      const s = (d - h.x) / h.w;
      if (s <= -1) return 0;
      if (s >= 1) return h.a * h.w;
      return h.a * h.w * ((s + 1) / 2 + Math.sin(Math.PI * s) / (2 * Math.PI));
    }

    // Like alongWithCorners, for stop-to-stop run j of a trip, with its stops and hold-ups:
    // `f` is the share of the run's time gone, and the last trip.dwell[j] seconds of it are
    // spent waiting at the next stop.
    function alongWithHolds(trip, j, f) {
      const P = trip.pattern, d0 = P.stopDist[j], d1 = P.stopDist[j + 1];
      const holds = tripHolds(trip).filter(h => h.j === j);
      const T = stopTimes(trip), dt = T[j + 1] - T[j], dwell = trip.dwell[j] ?? 0;
      if (dwell > 0 && dt > dwell) f = Math.min(1, f * dt / (dt - dwell));
      if (!holds.length || f <= 0 || f >= 1) return alongWithCorners(P, d0, d1, f);
      const cost = d => holds.reduce((c, h) => c + holdCost(h, d), costAt(P, d));
      const c0 = cost(d0), target = c0 + (cost(d1) - c0) * f;
      let lo = d0, hi = d1;
      for (let k = 0; k < 32; k++) {
        const mid = (lo + hi) / 2;
        if (cost(mid) < target) lo = mid;
        else hi = mid;
      }
      return (lo + hi) / 2;
    }

    // Every journey through `stop` that is under way now (or about to be), with its timings.
    async function journeysThrough(stop) {
      const now = londonNow();
      const calls = [];
      for (const offset of [-1, 0]) {
        const runs = stop.tables.services.map(svc => serviceRunsOn(svc, now.y, now.m, now.d + offset));
        for (const [secs, line, headsign, svc, , variant, pos] of stop.departures) {
          const at = offset * 86400 + secs;  // seconds after today's midnight
          if (Math.abs(at - now.secs) <= VEHICLE_WINDOW && runs[svc]) calls.push({ at, line, headsign, variant, pos });
        }
      }
      const lines = [...new Set(calls.map(c => c.line))];
      const data = new Map(await Promise.all(lines.map(async l => [l, await loadLine(l)])));
      const trips = new Map();  // a journey calling at two of a cluster's stops is still one bus
      for (const c of calls) {
        const d = data.get(c.line);
        const [p, ...offsets] = d.variants[c.variant];
        const start = c.at - offsets[c.pos] * 60;
        const end = start + offsets.at(-1) * 60;
        if (end < now.secs - 1800 || start > now.secs + 60) continue;  // late buses can run past their end
        const key = `${c.line}|${c.variant}|${start}`;
        if (!trips.has(key)) {
          trips.set(key, { key, line: c.line, variant: c.variant, headsign: stop.tables.headsigns[c.headsign],
            pattern: patternGeometry(d.patterns[p], d.stops, isTramLine(c.line) ? "tram" : "bus"),
            stops: d.stops, offsets, start, end, stopAt: c.at });
        }
      }
      return [...trips.values()];
    }

    // Trams stop at every stop: they leave on time, speed up, cruise, brake into the next stop
    // and wait at the platform. Buses only stop when someone's waiting, so they keep a steady
    // pace between timetabled stops. Both slow for bends (see "Slowing for corners").
    const TRAM_DWELL_SECS = 25;
    const TRAM_DWELL_SHARE = 0.25;  // ...but never more than this share of the time between stops
    const TRAM_MIN_DWELL_SECS = 8;  // the shortest wait, when the timetable leaves little time
    const TRAM_ACCEL_SHARE = 0.25;  // share of the running time spent speeding up, and again braking
    const TRAM_TOP_SPEED = 22.2;    // m/s: Metrolink's 80 km/h

    // Each stop's time in seconds from the start of the journey. Timetables give whole minutes,
    // so neighbouring stops can share one; those are spread out by distance so a vehicle never
    // covers the gap between them in no time at all (which made buses jump hundreds of metres).
    function stopTimes(trip) {
      if (trip.stopTimes) return trip.stopTimes;
      const T = trip.offsets.map(m => m * 60), D = trip.pattern.stopDist, out = T.slice();
      for (let i = 0, g = 0; i < T.length;) {  // g: first stop of the group before this one
        let k = i;
        while (k + 1 < T.length && T[k + 1] === T[i]) k++;
        if (k > i && k + 1 < T.length) {
          // Stops i..k share a minute: spread them towards the next stop's time.
          const span = D[k + 1] - D[i], dt = T[k + 1] - T[i];
          for (let m = i + 1; m <= k; m++) out[m] = T[i] + (span ? (D[m] - D[i]) / span : (m - i) / (k + 1 - i)) * dt;
        } else if (k > i && i > 0) {
          // The last few stops share the final minute: spread them, and the group before
          // (which was spread towards this one), evenly from that group's start to the end.
          const span = D[k] - D[g], dt = T[k] - T[g];
          for (let m = g + 1; m < k; m++) out[m] = T[g] + (span ? (D[m] - D[g]) / span : (m - g) / (k - g)) * dt;
        }
        g = i;
        i = k + 1;
      }
      return (trip.stopTimes = out);
    }

    // Share of the distance covered after share `u` of the running time, for a vehicle that
    // speeds up evenly, cruises, then brakes evenly. Its top speed is only a third above its
    // average, so short hops between stops don't need unrealistic bursts of speed.
    function accelerateCruiseBrake(u, a = TRAM_ACCEL_SHARE) {
      const top = 1 / (1 - a);
      if (u < a) return 0.5 * top * u * u / a;
      if (u > 1 - a) return 1 - 0.5 * top * (1 - u) * (1 - u) / a;
      return 0.5 * top * a + top * (u - a);
    }

    // How long a tram waits, and how gently it speeds up, between two stops `travel` seconds
    // apart. `metres` allows for bends (they count extra). Where the timetable is tight, the
    // wait shortens and the tram reaches cruising speed sooner, rather than go over 80 km/h.
    function tramTiming(travel, metres) {
      let dwell = Math.min(TRAM_DWELL_SECS, TRAM_DWELL_SHARE * travel);
      let accel = TRAM_ACCEL_SHARE;
      const peak = () => metres / (travel - dwell) / (1 - accel);
      if (peak() > TRAM_TOP_SPEED) {
        const needed = travel - metres / ((1 - accel) * TRAM_TOP_SPEED);
        dwell = Math.max(Math.min(TRAM_MIN_DWELL_SECS, dwell), Math.min(dwell, needed));
      }
      if (peak() > TRAM_TOP_SPEED) accel = Math.max(0.08, 1 - metres / ((travel - dwell) * TRAM_TOP_SPEED));
      return { dwell, accel };
    }

    function tramDistanceAt(trip, e) {
      const T = stopTimes(trip), D = trip.pattern.stopDist;
      if (e <= T[0]) return { d: D[0], next: Math.min(1, T.length - 1) };
      let j = 0;
      while (j + 1 < T.length && T[j + 1] <= e) j++;
      if (j + 1 >= T.length) return { d: D[j], next: j };
      const travel = T[j + 1] - T[j];
      const P = trip.pattern;
      const { dwell, accel } = tramTiming(travel, costAt(P, D[j + 1]) - costAt(P, D[j]));
      const arrive = T[j + 1] - dwell;
      if (e >= arrive) return { d: D[j + 1], next: j + 1 };     // waiting at the platform
      const f = accelerateCruiseBrake((e - T[j]) / (arrive - T[j]), accel);
      return { d: alongWithCorners(trip.pattern, D[j], D[j + 1], f), next: j + 1 };
    }

    // How far along its path a trip is `e` seconds after it starts, and the next stop's index.
    function distanceAt(trip, e) {
      if (isTramLine(trip.line)) return tramDistanceAt(trip, e);
      const T = stopTimes(trip), D = trip.pattern.stopDist;
      if (e <= T[0]) return { d: D[0], next: Math.min(1, T.length - 1) };
      let j = 0;
      while (j + 1 < T.length && T[j + 1] <= e) j++;
      if (j + 1 >= T.length) return { d: D[j], next: j };
      const f = (e - T[j]) / (T[j + 1] - T[j]);
      // Live buses are where they really are, so they don't get made-up hold-ups.
      return { d: trip.live ? alongWithCorners(trip.pattern, D[j], D[j + 1], f) : alongWithHolds(trip, j, f), next: j + 1 };
    }

    // The inverse: seconds after the start when the timetable has the trip at distance `d`.
    function timeAtDistance(trip, d) {
      const T = stopTimes(trip), D = trip.pattern.stopDist;
      let j = 0;
      while (j + 1 < D.length && D[j + 1] <= d) j++;
      if (j + 1 >= D.length || D[j + 1] === D[j]) return T[j];
      return T[j] + cornerTimeFraction(trip.pattern, D[j], D[j + 1], d) * (T[j + 1] - T[j]);
    }

    // A late bus is where the timetable had it `delay` seconds ago.
    const delayOf = trip => trip.live?.delay ?? 0;
    const tripClock = (trip, now) => now - trip.start - delayOf(trip);
    const isRunning = (trip, now) => { const e = tripClock(trip, now); return e >= 0 && e <= trip.offsets.at(-1) * 60; };

    // Where a trip is at `now` (seconds after midnight): position, and the next stop's index.
    function tripPosition(trip, now) {
      const e = tripClock(trip, now);
      const leaving = leavingPose(trip, e);
      if (leaving) return { lngLat: leaving.front, next: e < 0 ? 0 : 1 };
      const { d, next } = distanceAt(trip, routeClock(trip, e));
      return { lngLat: pointAlong(trip.pattern, d), next };
    }

    // ---- Leaving a stand ----------------------------------------------------------------
    // A journey that starts at an interchange stand waits in the stand's own spot, where the
    // stand diagram draws it. At its time it leaves: out of a nose-in bay it reverses slowly,
    // swinging round towards the way out, stops, then pulls away; from a kerbside stand it just
    // pulls away. It joins its route a little way along and makes up the time by the next stop.
    const REVERSE_M = 14, REVERSE_SECS = 14, MIN_REVERSE_SECS = 8, PAUSE_SECS = 2, MAX_REVERSE_TURN = 110;
    const MAX_SQUEEZE = 1.5;
    const JOIN_M = 30;               // joins its route this far along
    const PULL_AWAY_SPEED = 2.5;     // average m/s pulling away, speeding up as it goes
    const deg = Math.PI / 180;

    // The interchange stand a pattern starts from, if it's one with a parking spot drawn.
    function startStand(pattern, stops) {
      if (pattern.startStand !== undefined) return pattern.startStand;
      pattern.startStand = null;
      const [, , lng, lat] = stops[pattern.stops[0]];
      const kx = 111320 * Math.cos(lat * deg);
      const far = (a, b) => Math.hypot((a[0] - b[0]) * kx, (a[1] - b[1]) * 110540);
      let best = 15;  // metres: the stop and the stand are the same NaPTAN point, give or take
      for (const layout of Object.values(LAYOUTS)) {
        if (far(layout.origin, [lng, lat]) > 800) continue;
        for (const stand of layout.stands) {
          if (!stand.bus) continue;
          const off = far(toLngLat(layout, [stand.x, stand.y]), [lng, lat]);
          if (off < best) { best = off; pattern.startStand = { layout, stand }; }
        }
      }
      return pattern.startStand;
    }

    // How a trip leaves its stand, worked out once: positions in metres east and north of the
    // parked bus's front axle, and how long each part takes.
    function leavePlan(trip) {
      if (trip.leave !== undefined) return trip.leave;
      trip.leave = null;
      if (isTramLine(trip.line) || !trip.stops) return null;
      const P = trip.pattern, T = stopTimes(trip), D = P.stopDist;
      const found = startStand(P, trip.stops);
      if (!found || T.length < 2 || D[1] < JOIN_M + 20) return null;
      const { layout, stand } = found;
      const u = h => [Math.sin(h * deg), Math.cos(h * deg)];  // east, north
      const h0 = stand.bus.heading;
      // The diagram's bus has its front at stand.bus.front; the front axle is 1.5 m behind.
      const nose = toLngLat(layout, stand.bus.front);
      const kx = 111320 * Math.cos(nose[1] * deg);
      const origin = [nose[0] - u(h0)[0] * 1.5 / kx, nose[1] - u(h0)[1] * 1.5 / 110540];
      const toMetres = ll => [(ll[0] - origin[0]) * kx, (ll[1] - origin[1]) * 110540];
      const toLL = ([x, y]) => [origin[0] + x / kx, origin[1] + y / 110540];
      const join = toMetres(pointAlong(P, JOIN_M)), hJ = bearingAlong(P, JOIN_M);
      // Reversing: the rear axle backs away along an arc, turning the bus by up to
      // MAX_REVERSE_TURN towards the way it'll leave. The front axle is 8 m ahead of it.
      const bay = stand.kind === "bay";
      const turn = Math.max(-MAX_REVERSE_TURN, Math.min(MAX_REVERSE_TURN, ((hJ - h0 + 540) % 360) - 180));
      const steps = 24, back = [];
      let rear = [-u(h0)[0] * BUS_REAR_AXLE_M, -u(h0)[1] * BUS_REAR_AXLE_M];
      for (let k = 0; k <= steps; k++) {
        const h = h0 + (bay ? turn * k / steps : 0);
        back.push({ rear: rear.slice(), h });
        const step = bay ? REVERSE_M / steps : 0;
        rear = [rear[0] - u(h)[0] * step, rear[1] - u(h)[1] * step];
      }
      const last = back.at(-1), h1 = last.h;
      const start = [last.rear[0] + u(h1)[0] * BUS_REAR_AXLE_M, last.rear[1] + u(h1)[1] * BUS_REAR_AXLE_M];
      // Pulling away: a smooth curve from there to the join, leaving and arriving straight.
      const gap = Math.hypot(join[0] - start[0], join[1] - start[1]);
      const k0 = gap * 1.2, t0 = u(h1), t1 = u(hJ);
      const curve = t => {
        const a = 2 * t ** 3 - 3 * t ** 2 + 1, b = t ** 3 - 2 * t ** 2 + t, c = -2 * t ** 3 + 3 * t ** 2, d = t ** 3 - t ** 2;
        return [a * start[0] + b * k0 * t0[0] + c * join[0] + d * k0 * t1[0], a * start[1] + b * k0 * t0[1] + c * join[1] + d * k0 * t1[1]];
      };
      let length = 0;
      for (let k = 1, prev = curve(0); k <= 24; k++) { const q = curve(k / 24); length += Math.hypot(q[0] - prev[0], q[1] - prev[1]); prev = q; }
      let lo = 0, hi = T[1];  // when the bus would pass the join point, stops and hold-ups included
      for (let k = 0; k < 40; k++) { const mid = (lo + hi) / 2; if (distanceAt(trip, mid).d < JOIN_M) lo = mid; else hi = mid; }
      const joinTime = hi;
      // Making up the time afterwards mustn't need more than MAX_SQUEEZE times the usual pace,
      // so when time is short it leaves the stand more briskly, or not at all.
      const allowed = T[1] - (T[1] - joinTime) / MAX_SQUEEZE;
      let reverseSecs = bay ? REVERSE_SECS : 0, pauseSecs = bay ? PAUSE_SECS : 0, pullSecs = Math.max(6, length / PULL_AWAY_SPEED);
      const wanted = reverseSecs + pauseSecs + pullSecs;
      if (wanted > allowed) {
        const k = allowed / wanted;
        reverseSecs *= k; pauseSecs *= k; pullSecs *= k;
        if ((bay && reverseSecs < MIN_REVERSE_SECS) || pullSecs < 4) return null;  // no time to do it properly
      }
      const total = reverseSecs + pauseSecs + pullSecs;
      if (joinTime >= T[1]) return null;
      return (trip.leave = { back, curve, toLL, h0, reverseSecs, pauseSecs, pullSecs, total, joinTime, T1: T[1] });
    }

    // The trip's clock as its route sees it: after a stand departure, the rest of the run to the
    // first stop is squeezed so it still gets there on time.
    function routeClock(trip, e) {
      const plan = leavePlan(trip);
      if (!plan || e < plan.total || e >= plan.T1) return e;
      return plan.joinTime + (e - plan.total) * (plan.T1 - plan.joinTime) / (plan.T1 - plan.total);
    }

    // While a trip is in or leaving its stand: its front axle, body middle and heading.
    function leavingPose(trip, e) {
      if (trip.live) return null;
      const plan = leavePlan(trip);
      if (!plan || e >= plan.total) return null;
      const u = h => [Math.sin(h * deg), Math.cos(h * deg)];
      let front, h;
      if (e < plan.reverseSecs + plan.pauseSecs) {
        const f = e <= 0 ? 0 : Math.min(1, e / plan.reverseSecs);
        const at = (f * f * (3 - 2 * f)) * (plan.back.length - 1);  // eases off and back on
        const i = Math.min(plan.back.length - 2, Math.floor(at)), t = at - i;
        const a = plan.back[i], b = plan.back[i + 1];
        h = a.h + (b.h - a.h) * t;
        const rear = [a.rear[0] + (b.rear[0] - a.rear[0]) * t, a.rear[1] + (b.rear[1] - a.rear[1]) * t];
        front = [rear[0] + u(h)[0] * BUS_REAR_AXLE_M, rear[1] + u(h)[1] * BUS_REAR_AXLE_M];
      } else {
        const g = (e - plan.reverseSecs - plan.pauseSecs) / plan.pullSecs, t = g * g;  // pulls away from a standstill
        front = plan.curve(t);
        const ahead = plan.curve(Math.min(1, t + 0.02)), behind = plan.curve(Math.max(0, t - 0.02));
        h = Math.atan2(ahead[0] - behind[0], ahead[1] - behind[1]) / deg;
      }
      const middle = [front[0] - u(h)[0] * (BUS_REAR_AXLE_M - (BUS_LENGTH_M / 2 - BUS_REAR_OVERHANG_M)),
                      front[1] - u(h)[1] * (BUS_REAR_AXLE_M - (BUS_LENGTH_M / 2 - BUS_REAR_OVERHANG_M))];
      return { front: plan.toLL(front), lngLat: plan.toLL(middle), bearing: h };
    }

    const nowSeconds = () => {
      const ms = Date.now();  // one reading, so the fraction and the whole seconds agree
      return londonNow(new Date(ms)).secs + (ms % 1000) / 1000;
    };
    const runningTrips = (now = nowSeconds()) => tracked.trips.filter(t => isRunning(t, now));

    // The network's copy of a station's tram journey. Station times are whole minutes while the
    // network's starts carry seconds, so the two can disagree by a minute or so.
    const fleetTwin = trip => isTramLine(trip.line) && fleet.trips.find(t =>
      t.key === trip.key || (t.line === trip.line && t.variant === trip.variant && Math.abs(t.start - trip.start) <= 90));

    function vehicleData() {
      const now = nowSeconds();
      return collection(dotTrips().flatMap(trip => {
        // A followed bus is drawn waiting at its first stop until it sets off.
        const waiting = trip.key === following && tripClock(trip, now) < 0;
        if (!isRunning(trip, now) && !waiting) return [];
        if (fleetOn() && fleetTwin(trip)) return [];  // drawn as a moving tram
        const followed = trip.key === following;  // drawn by the follow marker, not here
        return [point(tripPosition(trip, now).lngLat, {
          key: trip.key, route: shortLineName(trip.line), passed: now - delayOf(trip) > trip.stopAt,
          live: !!trip.live, followed,
          // Dark buses with white numbers, so they don't look like the yellow interchange markers.
          colour: META.lines[trip.line][5] || "#1f2933", text: "#ffffff"
        })];
      }));
    }

    // Where a bus's body sits with its front at distance d. A bus steers from the front and its
    // rear wheels follow the road behind, so the body points from the rear axle (about 8 m back
    // along the road) to the front: going round a corner the nose swings in first and the back
    // cuts the inside, rather than the whole bus turning on the spot.
    const BUS_REAR_AXLE_M = 8, BUS_LENGTH_M = 12, BUS_REAR_OVERHANG_M = 2.5;
    function busPose(pattern, d) {
      const front = pointAlong(pattern, d);
      const kx = Math.cos(front[1] * Math.PI / 180);
      let rear = pointAlong(pattern, Math.max(0, d - BUS_REAR_AXLE_M));
      if (d < BUS_REAR_AXLE_M) {  // just setting off: the road behind runs straight back from the start
        const start = pointAlong(pattern, 0), on = pointAlong(pattern, Math.min(10, pattern.cum.at(-1)));
        const len = Math.hypot((on[0] - start[0]) * kx * 111320, (on[1] - start[1]) * 110540);
        if (len > 0.5) {
          const back = (BUS_REAR_AXLE_M - d) / len;
          rear = [start[0] - (on[0] - start[0]) * back, start[1] - (on[1] - start[1]) * back];
        }
      }
      const ex = (front[0] - rear[0]) * kx * 111320, ny = (front[1] - rear[1]) * 110540;
      const span = Math.hypot(ex, ny);
      if (span < 1) return { lngLat: front, bearing: bearingAlong(pattern, d) };  // not under way yet
      // The body's middle is half a length minus the rear overhang ahead of the rear axle.
      const k = (BUS_LENGTH_M / 2 - BUS_REAR_OVERHANG_M) / span;
      return { lngLat: [rear[0] + (front[0] - rear[0]) * k, rear[1] + (front[1] - rear[1]) * k],
        bearing: Math.atan2(ex, ny) * 180 / Math.PI };
    }

    // A bus seen from above, like the ones waiting in the stand diagrams, nose to the right.
    function busImage() {
      const s = 2, w = 124 * s, h = 30 * s, c = document.createElement("canvas");
      c.width = w; c.height = h;
      const g = c.getContext("2d");
      g.scale(s, s);
      g.lineJoin = "round";
      // Body: 12 m by 2.55 m at 10 px a metre, with the front corners cut like the diagram's.
      g.beginPath();
      g.moveTo(2, 2.25); g.lineTo(115, 2.25); g.lineTo(122, 7.25); g.lineTo(122, 22.75); g.lineTo(115, 27.75); g.lineTo(2, 27.75);
      g.closePath();
      g.fillStyle = "#ffc72c";
      g.fill();
      g.strokeStyle = "#1f2933";
      g.lineWidth = 2.5;
      g.stroke();
      g.beginPath();  // windscreen
      g.moveTo(106, 4.75); g.lineTo(118.5, 8.75); g.lineTo(118.5, 21.25); g.lineTo(106, 25.25);
      g.closePath();
      g.fillStyle = "rgba(31, 41, 51, 0.8)";
      g.fill();
      return g.getImageData(0, 0, w, h);
    }

    function addVehiclesToMap() {
      if (!(tracked.stop || route?.trip) || map.getSource("veh-src")) return;
      map.addSource("veh-src", { type: "geojson", data: vehicleData() });
      // Buses that have already left the stop are paler than those still to come.
      const opacity = ["case", ["get", "passed"], 0.55, 1];
      const isFollowed = ["==", ["get", "followed"], true];
      map.addLayer({ id: "veh-dot", type: "circle", source: "veh-src", filter: ["!", isFollowed],
        paint: {
          // Zoom has to be the outermost expression, so the followed bus's bigger size goes inside it.
          "circle-radius": ["interpolate", ["linear"], ["zoom"],
            9, ["case", ["get", "followed"], 11, 8], 14, ["case", ["get", "followed"], 15, 11],
            18, ["case", ["get", "followed"], 19, 14]],
          "circle-color": ["get", "colour"], "circle-opacity": opacity,
          "circle-stroke-color": ["case", ["get", "followed"], "#2563eb", ["get", "live"], "#22c55e", "#ffffff"],
          "circle-stroke-width": ["case", ["get", "followed"], 4, ["get", "live"], 3, 2], "circle-stroke-opacity": opacity
        } });
      map.addLayer({ id: "veh-label", type: "symbol", source: "veh-src", minzoom: 9, filter: ["!", isFollowed],
        layout: { "text-field": ["get", "route"], "text-font": LABEL_FONT_BOLD,
          "text-size": ["interpolate", ["linear"], ["zoom"], 9, 9, 16, 11],
          "text-allow-overlap": true, "text-ignore-placement": true },
        paint: { "text-color": ["get", "text"], "text-opacity": opacity } });
    }

    function drawVehicles() {
      const source = map.getSource("veh-src");
      if (source) source.setData(vehicleData());
      else addVehiclesToMap();
    }

    async function trackStation(stop, onChange) {
      untrackStation();
      const token = tracked.token;
      Object.assign(tracked, { stop, onChange });
      const refresh = async () => {
        try {
          const trips = await journeysThrough(stop);
          if (tracked.token !== token) return;  // a different stop was opened meanwhile
          for (const t of trips) t.live = tracked.trips.find(old => old.key === t.key)?.live;  // keep until re-matched
          tracked.trips = trips;
          matchLive();
          drawVehicles();
          tracked.onChange?.();
        } catch (err) {
          console.error(err);
        }
      };
      tracked.timer = setInterval(refresh, 30_000);
      startLive();
      await refresh();
    }

    function untrackStation() {
      tracked.token++;
      clearInterval(tracked.timer);
      stopLive();
      stopFollowing();
      Object.assign(tracked, { stop: null, trips: [], onChange: null });
      removeLayers("veh-");
    }


    // ---- Live positions (optional) -----------------------------------------------------
    // Served by tools/live_server.py with a Bus Open Data Service key, api/live returns real
    // bus positions. Each is matched to its timetabled journey (same route number, same start
    // time, on its route) and its delay found from how far along the route it really is.
    // Opened straight from disk, or without a key, buses stay at their timetabled positions.
    const live = { state: location.protocol.startsWith("http") ? "waiting" : "unavailable", vehicles: [], timer: null };
    const LIVE_POLL_MS = 15_000;
    const LIVE_STALE_SECS = 300;  // ignore positions older than this

    // An ISO time as seconds after today's London midnight (negative for yesterday).
    function londonSeconds(iso) {
      const date = iso && new Date(iso);
      if (!date || isNaN(date)) return null;
      const p = Object.fromEntries(londonClock.formatToParts(date).map(x => [x.type, Number(x.value)]));
      const today = londonNow();
      const days = Math.round((Date.UTC(p.year, p.month - 1, p.day) - Date.UTC(today.y, today.m - 1, today.d)) / 86400000);
      return days * 86400 + p.hour * 3600 + p.minute * 60 + p.second;
    }

    async function pollLive() {
      if (live.state === "unavailable") return;
      try {
        const body = await (await fetch("api/live", { cache: "no-store" })).json();
        if (!body.ok) {
          live.state = "off";
          return;
        }
        live.state = "on";
        live.vehicles = body.vehicles.map(v => ({ ...v, origin: londonSeconds(v.originAimed), recorded: londonSeconds(v.recordedAt) }));
        matchLive();
      } catch {
        live.state = "unavailable";  // not served by tools/live_server.py
      }
    }
    function startLive() {
      if (live.state === "unavailable" || live.timer) return;
      pollLive();
      live.timer = setInterval(pollLive, LIVE_POLL_MS);
    }
    function stopLive() {
      clearInterval(live.timer);
      live.timer = null;
    }

    // Project a real position onto the trip's path: distance along it and how far off it is,
    // preferring the stretch near where the timetable expects it (routes can loop back).
    function projectOntoTrip(trip, lngLat, expectedD) {
      const { track: path, cum } = trip.pattern;
      const kx = 111320 * Math.cos(lngLat[1] * Math.PI / 180);
      let best = null;
      for (let k = 1; k < path.length; k++) {
        const ax = (path[k - 1][0] - lngLat[0]) * kx, ay = (path[k - 1][1] - lngLat[1]) * 110540;
        const bx = (path[k][0] - lngLat[0]) * kx, by = (path[k][1] - lngLat[1]) * 110540;
        const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy || 1e-9;
        const t = Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len2));
        const off = Math.hypot(ax + t * dx, ay + t * dy);
        const d = cum[k - 1] + t * (cum[k] - cum[k - 1]);
        const score = off + 0.05 * Math.abs(d - expectedD);
        if (!best || score < best.score) best = { d, off, score };
      }
      return best;
    }

    function matchLive() {
      if (live.state !== "on") return;
      const now = nowSeconds();
      for (const trip of dotTrips()) {
        trip.live = undefined;
        const name = META.lines[trip.line][0];
        for (const v of live.vehicles) {
          if (v.line !== name || v.origin === null || v.recorded === null) continue;
          if (Math.abs(v.origin - trip.start) > 120 || now - v.recorded > LIVE_STALE_SECS) continue;
          const expected = distanceAt(trip, v.recorded - trip.start).d;
          const hit = projectOntoTrip(trip, v.lngLat, expected);
          if (!hit || hit.off > 150) continue;  // same number, different route (49 numbers are shared)
          // A bus waiting at its first stop before it's due isn't early.
          const waiting = hit.d <= trip.pattern.stopDist[0] + 30 && v.recorded < trip.start;
          const delay = waiting ? 0 : v.recorded - (trip.start + timeAtDistance(trip, hit.d));
          if (!trip.live || hit.off < trip.live.off) trip.live = { delay, off: hit.off, vehicle: v.vehicle, recorded: v.recorded };
        }
      }
    }

    function vehicleStatus(trip) {
      if (trip?.live) {
        const m = Math.round(trip.live.delay / 60);
        if (m >= 1) return { text: `Live · ${m} min late`, cls: "late" };
        if (m <= -1) return { text: `Live · ${-m} min early`, cls: "early" };
        return { text: "Live · on time", cls: "on-time" };
      }
      if (trip && tripClock(trip, nowSeconds()) < 0) return { text: "Not departed yet", cls: "none" };
      if (trip && isTramLine(trip.line)) return { text: "Timetable position", cls: "none" };  // no live tram positions
      if (live.state === "on") return { text: "No live signal from this bus · timetable position", cls: "none" };
      return { text: "Timetable position · early/late needs live data", cls: "none" };
    }

    // ---- Follow a bus ------------------------------------------------------------------
    let following = null;  // key of the followed journey
    // A journey by key, from the open stop's buses or the network's trams.
    const findTrip = key => tracked.trips.find(t => t.key === key) ?? fleet.trips.find(t => t.key === key) ??
      (route?.trip && route.trip.key === key ? route.trip : undefined);
    // Trips drawn as dots: the open stop's, plus the open journey if it isn't among them.
    const dotTrips = () => route?.trip && !tracked.trips.some(t => t.key === route.trip.key)
      ? [...tracked.trips, route.trip] : tracked.trips;

    function startFollowing(key) {
      const trip = findTrip(key);
      if (!trip) return;
      following = key;
      followIntro = true;  // let the first glide in finish before frames take over
      map.easeTo({ center: tripPosition(trip, nowSeconds()).lngLat, zoom: Math.max(map.getZoom(), 15.5),
        padding: panelPadding(), duration: 900 });
      map.once("moveend", () => { followIntro = false; });
      addVehiclesToMap();
      renderPanel();
    }

    // MapLibre keeps the padding given to easeTo/jumpTo, and later fitBounds calls add their own
    // on top. Once following ends, drop it without moving what's on screen.
    function clearCameraPadding() {
      const { top, right, bottom, left } = map.getPadding();
      if (!(top || right || bottom || left)) return;
      const canvas = map.getCanvas();
      const middle = map.unproject([canvas.clientWidth / 2, canvas.clientHeight / 2]);
      map.jumpTo({ center: middle, padding: { top: 0, right: 0, bottom: 0, left: 0 } });
    }

    function stopFollowing(message) {
      if (!following) return;
      following = null;
      removeFollowMarker();
      clearCameraPadding();
      if (route) renderPanel();
      if (message) document.getElementById("veh-next")?.replaceChildren(message);
    }

    // Every animation frame puts the camera on the bus. While the user is zooming or the
    // opening glide is running, frames are skipped rather than fighting them.
    let followIntro = false;
    let userMoving = false;
    map.on("movestart", e => { if (e.originalEvent) userMoving = true; });
    map.on("moveend", () => { userMoving = false; });
    // Re-centring every frame cancels the map's own gestures, so watch the pointer directly:
    // dragging the map ends following; wheel or pinch zooming just pauses it briefly.
    let gestureUntil = 0;
    const gestureArea = map.getCanvasContainer();
    gestureArea.addEventListener("wheel", () => { gestureUntil = performance.now() + 400; }, { passive: true });
    gestureArea.addEventListener("pointermove", e => { if (following && e.buttons && e.pointerType === "mouse") stopFollowing(); });
    gestureArea.addEventListener("touchmove", e => {
      if (!following) return;
      if (e.touches.length === 1) stopFollowing();
      else gestureUntil = performance.now() + 400;  // two fingers: zooming
    }, { passive: true });

    function followFrame() {
      if (!following || followIntro || userMoving || performance.now() < gestureUntil) return;
      const trip = findTrip(following);
      const now = nowSeconds();
      if (!trip || tripClock(trip, now) > trip.offsets.at(-1) * 60) return stopFollowing("This journey has finished.");
      map.jumpTo({ center: vehiclePose(trip, now).lngLat, padding: panelPadding() });
    }

    // ---- The followed vehicle -----------------------------------------------------------
    // Drawn as a marker rather than in a map layer: the map redraws a layer's data a frame or
    // two after it's given it, so a layer's bus lags the camera and wobbles about the middle of
    // the screen. A marker moves in step with the camera, so it stays put.
    const followMarker = { marker: null, key: null, tram: false, ratio: 1, label: null };

    // Where a vehicle is drawn now: the middle of its body, and the way it's facing.
    function vehiclePose(trip, now) {
      const e = tripClock(trip, now);
      const leaving = leavingPose(trip, e);
      if (leaving) return leaving;
      const { d } = distanceAt(trip, routeClock(trip, Math.max(0, e)));
      if (isTramLine(trip.line)) return { lngLat: pointAlong(trip.pattern, d), bearing: bearingAlong(trip.pattern, d) };
      return busPose(trip.pattern, d);
    }

    // Zoom-dependent sizes, as MapLibre's "interpolate" would give them.
    function interpolateZoom(stops, z, base = 1) {
      if (z <= stops[0][0]) return stops[0][1];
      for (let i = 1; i < stops.length; i++) {
        const [z0, v0] = stops[i - 1], [z1, v1] = stops[i];
        if (z > z1) continue;
        const t = base === 1 ? (z - z0) / (z1 - z0) : (base ** (z - z0) - 1) / (base ** (z1 - z0) - 1);
        return v0 + (v1 - v0) * t;
      }
      return stops.at(-1)[1];
    }
    // The bus picture is 124 px long at size 1 and 12 m long, so it's true to size from zoom
    // 18 in (a metre is 2^z / 46,640 px here); trams match the moving-tram icons, a size up.
    const BUS_SIZE = [[9, 0.3], [15, 0.45], [18, 0.55], [20, 2.2]], TRAM_SIZE = [[9, 0.95], [13, 1.35], [17, 1.8]];

    function makeFollowMarker(trip) {
      const tram = isTramLine(trip.line);
      const picture = tram ? tramImage(META.lines[trip.line][5] || "#555555") : busImage();
      const el = document.createElement("div");
      el.className = "follow-vehicle";
      const canvas = document.createElement("canvas");
      canvas.width = picture.width;
      canvas.height = picture.height;
      canvas.getContext("2d").putImageData(picture, 0, 0);
      el.append(canvas);
      let label = null;
      if (!tram) {
        label = document.createElement("span");
        label.textContent = shortLineName(trip.line);
        el.append(label);
      }
      el.addEventListener("click", e => { e.stopPropagation(); openTrip(trip); });
      const marker = new maplibregl.Marker({ element: el, rotationAlignment: "map", pitchAlignment: "map" });
      Object.assign(followMarker, { marker, key: trip.key, tram, ratio: picture.height / picture.width, label });
    }

    // Whether the open stand diagram is already drawing this bus waiting on its stand.
    function diagramShowsWaiting(trip, now) {
      if (!diagram.stop || !trip.stops || tripClock(trip, now) >= 0) return false;
      const found = startStand(trip.pattern, trip.stops);
      if (!found || diagram.layout !== found.layout) return false;
      const dep = standOccupancy(diagram.stop).get(found.stand.label);
      return !!dep && dep.line === trip.line && Math.abs((dep.at ?? dep.secs) - trip.start) < 60;
    }

    function removeFollowMarker() {
      followMarker.marker?.remove();
      Object.assign(followMarker, { marker: null, key: null, label: null });
    }

    function drawFollowMarker(now) {
      const trip = following && findTrip(following);
      const hidden = !trip || (isTramLine(trip.line) ? !tramToggle.checked || !!diagram.stop : diagramShowsWaiting(trip, now));
      if (hidden) return removeFollowMarker();
      if (followMarker.key !== trip.key) {
        removeFollowMarker();
        makeFollowMarker(trip);
      }
      const { marker, tram, ratio, label } = followMarker;
      const pose = vehiclePose(trip, now);
      const z = map.getZoom();
      const width = (tram ? 56 * interpolateZoom(TRAM_SIZE, z) : 124 * interpolateZoom(BUS_SIZE, z, 2));
      const el = marker.getElement();
      el.style.width = `${width}px`;
      el.style.height = `${width * ratio}px`;
      const rotate = pose.bearing - 90;
      marker.setLngLat(pose.lngLat).setRotation(rotate);
      if (label) {
        // The route number runs along the bus, turned so it never reads upside down.
        const upright = ((rotate % 360) + 450) % 180 - 90;
        label.style.fontSize = `${Math.max(6, width * 0.15)}px`;
        label.style.transform = `rotate(${upright - rotate}deg)`;
      }
      if (!marker._map) marker.addTo(map);
    }


    // Keeps the open bus card current: live status and next stop.
    function updateVehicleCard() {
      if (!route?.vehicle) return;
      const trip = findTrip(route.vehicle);
      const status = document.getElementById("veh-status");
      if (status) {
        const { text, cls } = vehicleStatus(trip);
        status.textContent = text;
        status.className = `veh-status ${cls}`;
      }
      const next = document.getElementById("veh-next");
      const now = nowSeconds();
      if (next && trip && tripClock(trip, now) < 0) {
        const leaves = trip.start + delayOf(trip);
        const mins = Math.max(0, Math.ceil((leaves - now) / 60));
        next.textContent = `Waiting at ${trip.stops[trip.pattern.stops[0]][0]} · leaves at ${clockTime(leaves)}${
          mins ? ` (in ${mins} min)` : ""}`;
      } else if (next && trip && isRunning(trip, now)) {
        const { next: k } = tripPosition(trip, now);
        const due = trip.start + trip.offsets[k] * 60 + delayOf(trip);
        next.textContent = `Next stop ${trip.stops[trip.pattern.stops[k]][0]} at ${clockTime(due)}${trip.live ? " (expected)" : ""}`;
      }
    }

    // "12 buses on these routes now" with a button that zooms out to show them all.
    function vehicleNoteHTML() {
      if (!tracked.stop) return "";
      const running = runningTrips();
      if (!running.length) return "";
      const trams = running.filter(t => isTramLine(t.line)).length;
      const what = trams === running.length ? "tram" : trams ? "bus or tram" : "bus";
      const plural = running.length === 1 ? what : what === "bus" ? "buses" : what === "tram" ? "trams" : "buses and trams";
      return `
        <div class="veh-note">
          <span class="veh-swatch" aria-hidden="true"></span>
          <span><strong>${running.length} ${plural}</strong> on these routes now${(() => {
            const n = running.filter(t => t.live).length;
            return n ? `, ${n} with live positions` : ", shown where the timetable puts them";
          })()}</span>
          <button type="button" class="veh-show">Show all</button>
        </div>`;
    }

    function showAllVehicles() {
      const now = nowSeconds();
      const pts = runningTrips(now).map(t => tripPosition(t, now).lngLat);
      if (tracked.stop?.lngLat) pts.push(tracked.stop.lngLat);
      if (pts.length) fitPoints(pts, { maxZoom: 15 });
    }

    // Clicking a moving bus shows the rest of its journey from its next stop.
    function openTrip(trip) {
      const { next } = tripPosition(trip, nowSeconds());
      const secs = trip.start + trip.offsets[next] * 60;
      const stopName = trip.stops[trip.pattern.stops[next]][0];
      const dep = { line: trip.line, variant: trip.variant, pos: next, secs, at: secs, clock: clockTime(secs),
        route: shortLineName(trip.line), colour: META.lines[trip.line][5], headsign: trip.headsign, stand: stopName };
      openRoute({ kind: "journey", line: trip.line, dep, stopName, clicked: true, fromDiagram: !!diagram.stop });
    }

    map.on("click", "veh-dot", e => { const trip = findTrip(e.features[0].properties.key); if (trip) openTrip(trip); });
    map.on("mouseenter", "veh-dot", () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", "veh-dot", () => { map.getCanvas().style.cursor = ""; });

    // ---- Interchange markers ---------------------------------------------------------
    const BUS_ICON = `<svg viewBox="0 0 24 24" fill="#1f2933" aria-hidden="true">
      <path d="M6 2h12a3 3 0 0 1 3 3v12a2 2 0 0 1-1 1.73V20a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-1.27A2 2 0 0 1 3 17V5a3 3 0 0 1 3-3Zm0 3v6h12V5H6Zm1.5 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm9 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/>
    </svg>`;

    const openPopups = new Set();
    function closePopups() {
      for (const p of [...openPopups]) p.remove();
    }
    function trackPopup(popup) {
      openPopups.add(popup);
      popup.on("close", () => openPopups.delete(popup));
      return popup;
    }

    const interchangeMarkers = new Map();
    for (const stop of INTERCHANGES) {
      stop.kind = "Bus interchange";
      const el = document.createElement("div");
      el.className = "interchange";
      el.innerHTML = `<span class="interchange-badge">${BUS_ICON}<span class="interchange-label">${stop.name}</span></span>`;
      const marker = new maplibregl.Marker({ element: el }).setLngLat(stop.lngLat).addTo(map);
      interchangeMarkers.set(stop.name, marker);
      el.tabIndex = 0;
      el.setAttribute("role", "button");
      // Interchanges with a stand layout open the diagram; any without one get a popup.
      const open = () => LAYOUTS[stop.name]
        ? openDiagram(stop, marker)
        : departuresPopup(trackPopup(new maplibregl.Popup({ offset: 20, maxWidth: "340px" }).setLngLat(stop.lngLat).addTo(map)), stop);
      el.setAttribute("aria-label", LAYOUTS[stop.name] ? `${stop.name}: show stand diagram` : stop.name);
      el.addEventListener("click", open);
      el.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
      });
    }

    // Always show names once zoomed in far enough for them not to crowd each other.
    const mapEl = map.getContainer();
    const syncLabels = () => {
      mapEl.classList.toggle("show-interchange-labels", map.getZoom() >= 12);
      mapEl.classList.toggle("compact-interchanges", map.getZoom() < 11.5);
    };
    map.on("zoom", syncLabels);
    syncLabels();

    // Filter: show / hide interchanges, remembered between visits.
    const interchangeToggle = document.getElementById("toggle-interchanges");
    interchangeToggle.checked = localStorage.getItem("gm-show-interchanges") !== "false";
    function syncInterchanges() {
      mapEl.classList.toggle("hide-interchanges", !interchangeToggle.checked);
      localStorage.setItem("gm-show-interchanges", String(interchangeToggle.checked));
      if (!interchangeToggle.checked) {
        closePopups();
        if (diagram.stop && LAYOUTS[diagram.stop.name]) closeDiagram();
      }
    }
    interchangeToggle.addEventListener("change", syncInterchanges);
    syncInterchanges();

    // ---- Other bus stops ---------------------------------------------------------------
    // data/stops.js lists ~12,000 stops and the Metrolink platforms; each stop's timetable is
    // in a ~2 km cell file under data/stops/, loaded only when a stop there is clicked.
    const STOPS_MIN_ZOOM = 13;
    const STOP_COLOURS = {
      light: { fill: "#ffffff", line: "#1f2933", text: "#1f2933", halo: "#ffffff" },
      dark: { fill: "#1f2933", line: "#eef1f5", text: "#eef1f5", halo: "#0d0f13" },
      satellite: { fill: "#ffffff", line: "#1f2933", text: "#ffffff", halo: "#000000" }
    };
    const CLUSTER_RING = "#2563eb";
    const stopsToggle = document.getElementById("toggle-stops");
    const stopsHint = document.getElementById("stops-hint");
    const loadStops = () => loadScript("data/stops.js");

    function addStopsToMap() {
      if (!window.GM_STOPS || map.getSource("stops")) return;
      const theme = STOP_COLOURS[document.body.dataset.theme] ?? STOP_COLOURS.light;
      map.addSource("stops", {
        type: "geojson",
        data: collection(GM_STOPS.stops.flatMap(([name, , lng, lat, , , , cluster, tram], i) =>
          tram ? [] : [point([lng, lat], { i, name, cluster: cluster >= 0 })]))
      });
      const visibility = stopsToggle.checked && !diagram.stop ? "visible" : "none";
      const before = firstLayer("ix-wash", "rt-wash", "rt-casing", "veh-dot");  // beneath any open diagram or route
      map.addLayer({
        id: "stops-dot", type: "circle", source: "stops", minzoom: STOPS_MIN_ZOOM,
        layout: { visibility },
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 13, 2.5, 16, 5, 19, 8],
          "circle-color": theme.fill,
          "circle-stroke-color": ["case", ["get", "cluster"], CLUSTER_RING, theme.line],
          "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 13, 1, 16, ["case", ["get", "cluster"], 2.5, 1.5]]
        }
      }, before);
      map.addLayer({
        id: "stops-label", type: "symbol", source: "stops", minzoom: 16,
        layout: {
          visibility, "text-field": ["get", "name"], "text-font": LABEL_FONT, "text-size": 12,
          "text-anchor": "top", "text-offset": [0, 0.9], "text-optional": true, "text-max-width": 9
        },
        paint: { "text-color": theme.text, "text-halo-color": theme.halo, "text-halo-width": 1.5 }
      }, before);
    }

    function syncStops() {
      localStorage.setItem("gm-show-stops", String(stopsToggle.checked));
      stopsHint.hidden = !stopsToggle.checked || map.getZoom() >= STOPS_MIN_ZOOM;
      if (stopsToggle.checked && !window.GM_STOPS) loadStops().then(addStopsToMap).catch(err => console.error(err));
      syncOverlayVisibility();
    }
    stopsToggle.checked = localStorage.getItem("gm-show-stops") !== "false";
    stopsToggle.addEventListener("change", syncStops);
    map.on("zoomend", () => { stopsHint.hidden = !stopsToggle.checked || map.getZoom() >= STOPS_MIN_ZOOM; });

    const INDICATOR_WORDS = { opp: "opposite", nr: "near", "o/s": "outside", adj: "adjacent", cnr: "corner", at: "at" };
    const describeIndicator = ind => INDICATOR_WORDS[ind.toLowerCase()] ?? ind;

    // A stop, cluster or tram station as the departures and diagram code expect: departure rows
    // plus the lookup tables they index into. Each stop index becomes a "stand".
    async function departureSource(indexes) {
      await loadStops();
      const cells = [...new Set(indexes.map(i => GM_STOPS.cells[GM_STOPS.stops[i][6]]))];
      await Promise.all(cells.map(cell => loadScript(`data/stops/${cell}.js`)));
      const stands = [];
      const departures = [];
      indexes.forEach(i => {
        const [, indicator, , , , , cell] = GM_STOPS.stops[i];
        let label = indicator || "Stop";
        while (stands.includes(label)) label += "′";  // two stops both "opp": keep them apart
        const stand = stands.push(label) - 1;
        // Cell rows: [line, headsign, service, [first minute, gaps...], [variant, position, count, ...]]
        for (const [line, headsign, svc, [first, ...gaps], runs] of GM_STOP_DEPS[GM_STOPS.cells[cell]][i] ?? []) {
          let minute = first, run = 0, left = runs[2];
          for (let k = 0; k <= gaps.length; k++) {
            if (k > 0) minute += gaps[k - 1];
            if (left === 0) { run += 3; left = runs[run + 2]; }
            departures.push([minute * 60, line, headsign, svc, stand, runs[run], runs[run + 1]]);
            left--;
          }
        }
      });
      departures.sort((a, b) => a[0] - b[0]);
      return { departures, tables: { services: META.services, headsigns: META.headsigns, stands } };
    }

    async function openStopPopup(i) {
      const [name, indicator, lng, lat, , locality] = GM_STOPS.stops[i];
      closePopups();
      const popup = trackPopup(new maplibregl.Popup({ offset: 12, maxWidth: "340px" })
        .setLngLat([lng, lat])
        .setHTML(`<p class="popup-name">${esc(name)}</p><p class="popup-meta">Loading times…</p>`)
        .addTo(map));
      try {
        const stop = {
          name, borough: GM_STOPS.localities[locality], lngLat: [lng, lat],
          kind: indicator ? `Bus stop, ${describeIndicator(indicator)}` : "Bus stop",
          ...(await departureSource([i]))
        };
        if (openPopups.has(popup)) departuresPopup(popup, stop);
      } catch (err) {
        console.error(err);
        popup.setHTML(`<p class="popup-name">${esc(name)}</p><p class="dep-empty">Couldn't load times. Try again in a moment.</p>`);
      }
    }

    // Clusters have no OpenStreetMap layout of their own, so build one from the stops:
    // each bus pulls up with its door at the stop, kerb on its left, facing NaPTAN's bearing.
    function clusterLayout(indexes, stands) {
      const pts = indexes.map(i => GM_STOPS.stops[i]);
      const origin = [pts.reduce((a, p) => a + p[2], 0) / pts.length, pts.reduce((a, p) => a + p[3], 0) / pts.length];
      const kx = 111320 * Math.cos(origin[1] * Math.PI / 180);
      return {
        origin, synthetic: true, building: [], busRoads: [], bays: [], roads: [], buildings: [],
        stands: pts.map(([, , lng, lat, bearing], k) => {
          const x = (lng - origin[0]) * kx, y = -(lat - origin[1]) * 110540;
          const label = stands[k];
          const short = label.replace(/^(stop|stand|stance)\s+/i, "");
          let bus = null;
          if (bearing !== null) {
            const h = bearing * Math.PI / 180, fwd = [Math.sin(h), -Math.cos(h)], right = [Math.cos(h), Math.sin(h)];
            bus = { heading: bearing, front: [x + right[0] * 1.575 + fwd[0] * 1.5, y + right[1] * 1.575 + fwd[1] * 1.5] };
          }
          return { label, short, x, y, kind: "kerb", heading: bearing, bus };
        })
      };
    }

    async function openCluster(c) {
      await loadStops();
      const [name, locality, indexes] = GM_STOPS.clusters[c];
      closePopups();
      let source;
      try {
        source = await departureSource(indexes);
      } catch (err) {
        console.error(err);
        return;
      }
      const layout = clusterLayout(indexes, source.tables.stands);
      const stop = { name, borough: GM_STOPS.localities[locality], kind: "Bus stops", lngLat: layout.origin, ...source };
      openDiagram(stop, null, layout);
    }

    function openStop(i) {
      const cluster = GM_STOPS.stops[i][7];
      if (cluster >= 0) openCluster(cluster);
      else openStopPopup(i);
    }

    map.on("click", "stops-dot", e => {
      if (diagram.stop) return;  // a stand diagram is open; its own stands take clicks
      openStop(e.features[0].properties.i);
    });
    map.on("mouseenter", "stops-dot", () => { if (!diagram.stop) map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", "stops-dot", () => { map.getCanvas().style.cursor = ""; });

    // ---- Metrolink -------------------------------------------------------------------
    // data/metrolink.js: the network in each line's colour, and stations (their platforms are
    // entries in data/stops.js, so tram times come through the same cell files as buses).
    const tramToggle = document.getElementById("toggle-trams");
    const loadMetrolink = () => Promise.all([loadScript("data/metrolink.js"), loadStops()]);

    function addMetrolinkToMap() {
      if (!window.GM_METROLINK || map.getSource("tram")) return;
      const theme = STOP_COLOURS[document.body.dataset.theme] ?? STOP_COLOURS.light;
      map.addSource("tram", {
        type: "geojson",
        data: collection([
          ...GM_METROLINK.network.flatMap(({ name, colour, paths }) => paths.map(path =>
            ({ type: "Feature", properties: { kind: "line", name, colour },
               geometry: { type: "LineString", coordinates: smoothPath(path, { maxCut: TRAM_CORNER_CUT_M }) } }))),
          ...GM_METROLINK.stations.map(([name, lng, lat], s) => point([lng, lat], { kind: "station", name, s }))
        ])
      });
      const visibility = tramToggle.checked && !diagram.stop ? "visible" : "none";
      const before = firstLayer("stops-dot", "ix-wash", "rt-wash", "rt-casing", "veh-dot");
      const isLine = ["==", ["get", "kind"], "line"], isStation = ["==", ["get", "kind"], "station"];
      map.addLayer({ id: "tram-casing", type: "line", source: "tram", filter: isLine,
        layout: { visibility, "line-cap": "round", "line-join": "round" },
        paint: { "line-color": theme.halo, "line-width": ["interpolate", ["linear"], ["zoom"], 9, 3, 15, 8] } }, before);
      map.addLayer({ id: "tram-lines", type: "line", source: "tram", filter: isLine,
        layout: { visibility, "line-cap": "round", "line-join": "round" },
        paint: { "line-color": ["get", "colour"], "line-width": ["interpolate", ["linear"], ["zoom"], 9, 1.5, 15, 4.5] } }, before);
      map.addLayer({ id: "tram-stations", type: "circle", source: "tram", filter: isStation, minzoom: 10,
        layout: { visibility },
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 10, 2.5, 15, 6],
          "circle-color": theme.fill, "circle-stroke-color": theme.line, "circle-stroke-width": 1.5
        } }, before);
      map.addLayer({ id: "tram-labels", type: "symbol", source: "tram", filter: isStation, minzoom: 12.5,
        layout: {
          visibility, "text-field": ["get", "name"], "text-font": LABEL_FONT_BOLD, "text-size": 12,
          "text-anchor": "left", "text-offset": [0.8, 0], "text-optional": true
        },
        paint: { "text-color": theme.text, "text-halo-color": theme.halo, "text-halo-width": 1.6 } }, before);
    }

    function syncTrams() {
      localStorage.setItem("gm-show-trams", String(tramToggle.checked));
      if (tramToggle.checked) {
        loadMetrolink().then(() => { addMetrolinkToMap(); startFleet(); }).catch(err => console.error(err));
      } else {
        stopFleet();
      }
      syncOverlayVisibility();
    }
    tramToggle.checked = localStorage.getItem("gm-show-trams") !== "false";
    tramToggle.addEventListener("change", syncTrams);

    async function openStation(s) {
      await loadMetrolink();
      const [name, lng, lat, platforms] = GM_METROLINK.stations[s];
      closePopups();
      const popup = trackPopup(new maplibregl.Popup({ offset: 12, maxWidth: "340px" })
        .setLngLat([lng, lat])
        .setHTML(`<p class="popup-name">${esc(name)}</p><p class="popup-meta">Loading times…</p>`)
        .addTo(map));
      try {
        const stop = { name, kind: "Metrolink stop", isTram: true, lngLat: [lng, lat], ...(await departureSource(platforms)) };
        if (openPopups.has(popup)) departuresPopup(popup, stop);
      } catch (err) {
        console.error(err);
        popup.setHTML(`<p class="popup-name">${esc(name)}</p><p class="dep-empty">Couldn't load times. Try again in a moment.</p>`);
      }
    }

    map.on("click", "tram-stations", e => {
      if (diagram.stop) return;
      openStation(e.features[0].properties.s);
    });
    map.on("mouseenter", "tram-stations", () => { if (!diagram.stop) map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", "tram-stations", () => { map.getCanvas().style.cursor = ""; });


    // ---- Every tram, moving ------------------------------------------------------------
    // While Metrolink is on, every tram in service is drawn where the timetable puts it now:
    // a small top-down tram in its line's colour, turned to face along the track. The
    // journeys are listed in data/metrolink.js; their paths and timings come from the line files.
    const fleet = { trips: [], timer: null, token: 0 };
    const fleetOn = () => tramToggle.checked && !!window.GM_METROLINK;

    async function runningTrams() {
      const now = londonNow();
      const calls = [];
      for (const offset of [-1, 0]) {
        const runs = META.services.map(svc => serviceRunsOn(svc, now.y, now.m, now.d + offset));
        for (const [line, variant, start, svc] of GM_METROLINK.trips) {
          const s = offset * 86400 + start;
          if (runs[svc] && s <= now.secs + 60 && s >= now.secs - 4 * 3600) calls.push({ line, variant, start: s });
        }
      }
      const data = new Map(await Promise.all([...new Set(calls.map(c => c.line))].map(async l => [l, await loadLine(l)])));
      const trips = [];
      for (const { line, variant, start } of calls) {
        const d = data.get(line);
        const [p, ...offsets] = d.variants[variant];
        const end = start + offsets.at(-1) * 60;
        if (end < now.secs - 60) continue;
        trips.push({ key: `${line}|${variant}|${start}`, line, variant, start, end, offsets, stops: d.stops,
          pattern: patternGeometry(d.patterns[p], d.stops, "tram"), headsign: d.patterns[p].to, stopAt: Infinity });
      }
      return trips;
    }

    // Images: a two-car tram seen from above, nose to the right, one per line colour, with an
    // arrowhead in front and a chevron on each car so its direction reads at any zoom. The
    // image rotates with the tram, so the arrows always point the way it's travelling. Blank
    // space behind balances the arrowhead, keeping the tram centred on its position.
    // Compass bearing of the track at distance d, in degrees.
    function bearingAlong(pattern, d) {
      const ahead = pointAlong(pattern, Math.min(d + 20, pattern.cum.at(-1)));
      const behind = pointAlong(pattern, Math.max(d - 20, 0));
      const kx = Math.cos(ahead[1] * Math.PI / 180);
      return Math.atan2((ahead[0] - behind[0]) * kx, ahead[1] - behind[1]) * 180 / Math.PI;
    }

    function tramImage(colour) {
      const w = 112, h = 26, c = document.createElement("canvas");
      c.width = w; c.height = h;
      const g = c.getContext("2d");
      g.lineJoin = "round";
      g.fillStyle = colour;
      g.strokeStyle = "#ffffff";
      g.lineWidth = 3;
      for (const x of [21, 56]) {  // rear car, front car
        g.beginPath();
        g.roundRect(x, 4, 33, h - 8, x === 56 ? [3, 9, 9, 3] : [9, 3, 3, 9]);
        g.fill();
        g.stroke();
      }
      g.beginPath();  // arrowhead ahead of the nose
      g.moveTo(93, 4);
      g.lineTo(108, h / 2);
      g.lineTo(93, h - 4);
      g.closePath();
      g.fill();
      g.stroke();
      g.strokeStyle = "#ffffff";  // a chevron on each car
      g.lineWidth = 3;
      g.lineCap = "round";
      for (const x of [33, 68]) {
        g.beginPath();
        g.moveTo(x, 8.5);
        g.lineTo(x + 6, h / 2);
        g.lineTo(x, h - 8.5);
        g.stroke();
      }
      return g.getImageData(0, 0, w, h);
    }
    const tramImageId = colour => `tram-${colour.replace("#", "")}`;

    function fleetData() {
      const now = nowSeconds();
      return collection(fleet.trips.flatMap(trip => {
        if (!isRunning(trip, now)) return [];
        const e = tripClock(trip, now);
        const { d } = distanceAt(trip, e);
        return [point(pointAlong(trip.pattern, d), { key: trip.key, image: tramImageId(META.lines[trip.line][5] || "#555555"),
          rotate: bearingAlong(trip.pattern, d) - 90, followed: trip.key === following })];
      }));
    }

    function addFleetToMap() {
      if (!fleetOn() || map.getSource("fleet-src")) return;
      for (const [, , , mode, , colour] of META.lines) {
        if (mode === "tram" && colour && !map.hasImage(tramImageId(colour))) {
          map.addImage(tramImageId(colour), tramImage(colour), { pixelRatio: 2 });
        }
      }
      map.addSource("fleet-src", { type: "geojson", data: fleetData() });
      map.addLayer({ id: "fleet-icon", type: "symbol", source: "fleet-src", filter: ["!", ["get", "followed"]],
        layout: {
          visibility: diagram.stop ? "none" : "visible",
          "icon-image": ["get", "image"], "icon-rotate": ["get", "rotate"],
          "icon-rotation-alignment": "map", "icon-allow-overlap": true, "icon-ignore-placement": true,
          "icon-size": ["interpolate", ["linear"], ["zoom"], 9, ["case", ["get", "followed"], 0.95, 0.7],
            13, ["case", ["get", "followed"], 1.35, 1], 17, ["case", ["get", "followed"], 1.8, 1.4]]
        } }, firstLayer("veh-dot"));
    }

    function drawFleet() {
      const source = map.getSource("fleet-src");
      if (source) source.setData(fleetData());
      else addFleetToMap();
    }

    async function startFleet() {
      if (fleet.timer || !fleetOn()) return;
      const token = ++fleet.token;
      const refresh = async () => {
        try {
          const trips = await runningTrams();
          if (fleet.token === token) fleet.trips = trips;
        } catch (err) {
          console.error(err);
        }
      };
      fleet.timer = setInterval(refresh, 60_000);
      await refresh();
      if (fleet.token === token) drawFleet();
    }

    function stopFleet() {
      fleet.token++;
      clearInterval(fleet.timer);
      fleet.timer = null;
      fleet.trips = [];
      removeLayers("fleet-");
    }

    map.on("click", "fleet-icon", e => {
      const trip = fleet.trips.find(t => t.key === e.features[0].properties.key);
      if (trip) openTrip(trip);
    });
    map.on("mouseenter", "fleet-icon", () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", "fleet-icon", () => { map.getCanvas().style.cursor = ""; });


    // ---- Smooth movement -------------------------------------------------------------------
    // One animation loop moves every bus and tram, and the camera when following, about 30 times
    // a second, so they glide instead of ticking. The bus card's text only needs updating twice
    // a second. The browser pauses the loop while the tab is hidden.
    let lastCard = 0;
    // Every frame, so vehicles move evenly; the followed one and the camera move together.
    function animate(time) {
      requestAnimationFrame(animate);
      if (styleLoading) return;
      if (!map.getSource("veh-src") && (tracked.stop || following)) addVehiclesToMap();
      if (route?.trip && route.path && !map.getSource("rt-progress-src") && map.getSource("rt-src")) {
        removeLayers("rt-");  // the journey's bus turned up after its route was drawn
        addRouteToMap();
      }
      map.getSource("veh-src")?.setData(vehicleData());
      map.getSource("fleet-src")?.setData(fleetData());
      map.getSource("rt-progress-src")?.setData(progressData());
      const now = nowSeconds();
      followFrame();
      drawFollowMarker(now);
      if (time - lastCard > 500) {
        lastCard = time;
        updateVehicleCard();
      }
    }
    requestAnimationFrame(animate);

    // Stops and trams hide while a stand diagram is open: they'd show through its wash.
    function syncOverlayVisibility() {
      const set = (ids, on) => ids.forEach(id => map.getLayer(id) && map.setLayoutProperty(id, "visibility", on ? "visible" : "none"));
      set(["stops-dot", "stops-label"], stopsToggle.checked && !diagram.stop);
      set(["tram-casing", "tram-lines", "tram-stations", "tram-labels", "fleet-icon"], tramToggle.checked && !diagram.stop);
    }

    // A style switch wipes custom layers; redraw everything in the new theme, bottom to top.
    map.on("style.load", () => {
      styleLoading = false;
      addMetrolinkToMap();
      addStopsToMap();
      addDiagramToMap();
      addRouteToMap();
      addFleetToMap();
      addVehiclesToMap();
    });
    map.once("load", () => {
      syncStops();
      syncTrams();
    });

    // ---- Search ------------------------------------------------------------------------
    // One box for routes ("203", "Pink Line"), interchanges, Metrolink stops, bus stops and
    // towns. The index is built the first time it's used, once data/stops.js is in.
    const searchInput = document.getElementById("search");
    const searchList = document.getElementById("search-results");
    let searchIndex = null;
    let searchHits = [];
    let searchActive = -1;
    const fold = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]+/g, " ").trim();

    async function buildSearchIndex() {
      await loadMetrolink();
      const entries = [];
      META.lines.forEach(([name, long, operator, mode], line) => {
        const replacement = name === "Replacement Bus";  // Metrolink replacement buses during works
        entries.push({ type: "route", rank: 0, line,
          label: replacement ? "Tram replacement bus" : mode === "tram" ? name : `Route ${name}`,
          key: replacement ? "replacement bus" : name,
          sub: [long, operator].filter(Boolean).join(" · ") });
      });
      for (const stop of INTERCHANGES) {
        entries.push({ type: "interchange", rank: 1, label: stop.name, sub: `Bus interchange · ${stop.borough}`, stop });
      }
      GM_METROLINK.stations.forEach(([name], s) =>
        entries.push({ type: "tram", rank: 2, label: name, sub: "Metrolink stop", s }));
      // Bus stops: one entry per name and area, however many stops share it.
      const places = new Map();
      const towns = new Map();
      GM_STOPS.stops.forEach(([name, , lng, lat, , locality, , , tram], i) => {
        if (tram) return;
        const town = GM_STOPS.localities[locality];
        const key = `${name}|${town}`;
        if (!places.has(key)) places.set(key, { type: "stop", rank: 4, label: name, sub: `Bus stop · ${town}`, stops: [] });
        places.get(key).stops.push(i);
        const t = towns.get(town) ?? towns.set(town, { n: 0, lng: 0, lat: 0 }).get(town);
        t.n++; t.lng += lng; t.lat += lat;
      });
      entries.push(...places.values());
      for (const [town, t] of towns) {
        if (t.n >= 5) entries.push({ type: "town", rank: 3, label: town, sub: `Area · ${t.n} bus stops`, lngLat: [t.lng / t.n, t.lat / t.n] });
      }
      for (const e of entries) e.folded = fold(e.label);
      return entries;
    }

    function searchScore(entry, q) {
      if (entry.type === "route") {
        const key = fold(entry.key);
        if (key === q) return 0;
        if (key.startsWith(q)) return 1;
      }
      // Names that start with the query tie, so the kind of place decides: interchange first.
      if (entry.folded.startsWith(q)) return 2;
      if (entry.folded.includes(` ${q}`)) return 3;
      return entry.type === "route" ? null : entry.folded.includes(q) && q.length >= 3 ? 4 : null;
    }

    async function runSearch() {
      const q = fold(searchInput.value);
      if (!q) return showHits([]);
      searchIndex ??= await buildSearchIndex();
      if (fold(searchInput.value) !== q) return;  // typed on while the index was building
      const hits = [];
      for (const entry of searchIndex) {
        const score = searchScore(entry, q);
        if (score !== null) hits.push({ entry, score });
      }
      hits.sort((a, b) => a.score - b.score || a.entry.rank - b.entry.rank || a.entry.label.length - b.entry.label.length);
      showHits(hits.slice(0, 8).map(h => h.entry), q);
    }

    const SEARCH_ICONS = { route: "Route", interchange: "Interchange", tram: "Tram", stop: "Stop", town: "Area" };
    function showHits(hits, query = "") {
      searchHits = hits;
      searchActive = hits.length ? 0 : -1;
      searchList.innerHTML = hits.length
        ? hits.map((h, i) => `
          <li role="option" id="search-${i}" data-i="${i}" aria-selected="${i === 0}">
            <span class="search-type">${SEARCH_ICONS[h.type]}</span>
            <span class="search-text">${esc(h.label)}<small>${esc(h.sub)}</small></span>
          </li>`).join("")
        : query ? `<li class="search-none">No matches</li>` : "";
      searchList.hidden = !searchList.innerHTML;
      searchInput.setAttribute("aria-expanded", String(!searchList.hidden));
      searchInput.setAttribute("aria-activedescendant", hits.length ? "search-0" : "");
    }

    function moveSearch(delta) {
      if (!searchHits.length) return;
      searchActive = (searchActive + delta + searchHits.length) % searchHits.length;
      searchList.querySelectorAll("[role=option]").forEach((li, i) => li.setAttribute("aria-selected", String(i === searchActive)));
      searchInput.setAttribute("aria-activedescendant", `search-${searchActive}`);
      searchList.querySelector(`#search-${searchActive}`)?.scrollIntoView({ block: "nearest" });
    }

    async function chooseHit(hit) {
      showHits([]);
      searchInput.value = hit.label;
      searchInput.blur();
      if (hit.type === "route") return showLine(hit.line);
      if (diagram.stop) closeDiagram({ restoreCamera: false });
      if (route) hideRoute();
      if (hit.type === "interchange") return openDiagram(hit.stop, interchangeMarkers.get(hit.stop.name));
      if (hit.type === "town") return map.flyTo({ center: hit.lngLat, zoom: 14.5, duration: 1200 });
      if (hit.type === "tram") {
        const [, lng, lat] = GM_METROLINK.stations[hit.s];
        map.flyTo({ center: [lng, lat], zoom: 16, duration: 1200 });
        return openStation(hit.s);
      }
      // A bus stop: a lettered cluster opens its diagram; otherwise show the first stop's times.
      const cluster = hit.stops.map(i => GM_STOPS.stops[i][7]).find(c => c >= 0);
      if (cluster !== undefined) return openCluster(cluster);
      const [, , lng, lat] = GM_STOPS.stops[hit.stops[0]];
      map.flyTo({ center: [lng, lat], zoom: 17, duration: 1200 });
      map.once("moveend", () => openStopPopup(hit.stops[0]));
    }

    searchInput.addEventListener("input", () => runSearch().catch(err => console.error(err)));
    searchInput.addEventListener("focus", () => { if (searchInput.value) runSearch(); });
    searchInput.addEventListener("keydown", e => {
      if (e.key === "ArrowDown") { e.preventDefault(); moveSearch(1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); moveSearch(-1); }
      else if (e.key === "Enter" && searchHits[searchActive]) { e.preventDefault(); chooseHit(searchHits[searchActive]); }
      else if (e.key === "Escape") { searchInput.value = ""; showHits([]); }
    });
    searchList.addEventListener("mousedown", e => e.preventDefault());  // keep focus until the click lands
    searchList.addEventListener("click", e => {
      const li = e.target.closest("[data-i]");
      if (li) chooseHit(searchHits[Number(li.dataset.i)]);
    });
    searchInput.addEventListener("blur", () => setTimeout(() => showHits([]), 150));
  </script>
</body>
</html>
